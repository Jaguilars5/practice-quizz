<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="logoGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glow background circle -->
  <circle cx="100" cy="100" r="88" fill="#6366f1" fill-opacity="0.08" />

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="74" stroke="url(#logoGrad)" stroke-width="8" fill="none" opacity="0.3" />

  <!-- Main Q letter shape -->
  <g filter="url(#glow)">
    <!-- Q circle -->
    <circle cx="100" cy="95" r="42" fill="url(#logoGrad)" />
    <!-- Q tail -->
    <path d="M128 125 L148 150" stroke="url(#logoGradLight)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Question mark accent -->
  <circle cx="88" cy="82" r="6" fill="#e0e7ff" />
  <circle cx="108" cy="82" r="6" fill="#e0e7ff" />
  <path d="M88 108 Q88 118 100 118 Q112 118 112 108" stroke="#e0e7ff" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Sparkle dots -->
  <circle cx="58" cy="50" r="3" fill="#a5b4fc" opacity="0.6" />
  <circle cx="150" cy="60" r="2.5" fill="#a5b4fc" opacity="0.4" />
  <circle cx="155" cy="130" r="3" fill="#a5b4fc" opacity="0.5" />
  <circle cx="50" cy="145" r="2" fill="#a5b4fc" opacity="0.3" />
</svg>
